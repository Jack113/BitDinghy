# BitDinghy: one Cargo "workspace" (like a .sln or a Go workspace) holding three crates.
#   dinghy-core    - the shared engine. All real logic lives here.
#   dinghy-cli     - the `dinghy` command-line program (thin front-end).
#   bitdinghy-app  - the `BitDinghy` window (thin front-end).
[workspace]
resolver = "3"
members = [
    "crates/dinghy-core",
    "crates/dinghy-cli",
    "crates/bitdinghy-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
# eframe 0.36 needs Rust 1.95, so that is our floor too.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jack113/BitDinghy"
authors = ["BitDinghy contributors"]
publish = false

# Dependency versions are chosen once, here, and each crate opts in with `workspace = true`.
[workspace.dependencies]
dinghy-core = { path = "crates/dinghy-core" }

# The BitTorrent engine. Pinned to ONE exact version on purpose: a new version may change
# its behaviour or saved files, so upgrading is a deliberate step, never automatic.
# `rust-tls` = pure-Rust TLS and hardware-accelerated SHA-1 (no OpenSSL to install, which keeps
# the program self-contained). We turn off the default features we don't use (HTTP API client).
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }

clap = { version = "4", features = ["derive"] }
thiserror = "2"
# Reading and writing the settings file. Cargo.lock holds toml at 1.1.6 (a month old) rather than
# the release published on the day it was added. Two of its helper crates (toml_parser,
# toml_datetime) are newer than we'd like but are required by toml 1.1.6 itself; see TODO.md.
toml = "1"
serde = { version = "1", features = ["derive"] }
# Our own tokio use (librqbit already brings tokio in; we just ask for the parts we call directly).
# `net` + `io-util`: the local channel between the command line and the window (M4).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
# The messages on that channel, one JSON line each (already in the build through librqbit).
serde_json = "1"
# Fetching web links to .torrent files (M5). Already in the build through librqbit, with the same
# pure-Rust TLS; we fetch ourselves so we can cap the size, the time and the redirects.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Parses magnet links (we validate them ourselves, see dinghy-core/src/magnet.rs).
url = "2"
# Finds the user's normal Downloads folder.
directories = "6"
# The saved download list (SQLite). `bundled` compiles SQLite itself into the program, so nothing
# extra has to be installed and every PC runs the same, tested SQLite version.
rusqlite = { version = "0.40", features = ["bundled"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tempfile = "3"
# Reads the window icon and logo pictures (already part of the build through egui).
png = "0.18"
# Windows only: marks the leftovers of unticked files hidden (M6), asks a drive's format and free
# room (M12), reads the Windows version for crash reports (M13), and the time zone for the
# history's days (M14). Already in the build through
# several crates; we only switch on the parts we use.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Time"] }
# Windows only, build time only: puts the icon and the "Details" information into the .exe files.
winresource = "0.1"

# The window toolkit. `glow` = OpenGL drawing (smaller and quicker to start than wgpu).
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# The "Open .torrent file..." dialog: Windows' own file dialog (on Linux, the desktop portal, so no
# GTK is needed). No default features: only the parts we use.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# The history's charts (M14): speed over the last minutes and daily totals. The version made for
# egui 0.36.
egui_plot = "0.37"

[profile.dev]
# Line numbers only (not every variable): backtraces and crash reports still show file and line,
# while the build folder stays much smaller (with full debug information it had grown to 36 GB
# and filled drive C:, M13).
debug = "line-tables-only"

[profile.release]
# Slower to compile, smaller and faster to run. Size/speed tuning is revisited at the first release.
lto = "fat"
codegen-units = 1
