# cargo-about: makes THIRD-PARTY-NOTICES.html, the licences of everything BitDinghy is built from
# (`cargo about generate about.hbs --output-file THIRD-PARTY-NOTICES.html`; see docs/RELEASE.md).
# The accepted licences are the same as the ones deny.toml allows.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    # egui's built-in fonts.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# Only what the shipped Windows and Linux programs contain (not tools used for building or tests).
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
