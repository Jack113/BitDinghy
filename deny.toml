# cargo-deny: the automatic license and safety check for our dependencies.
# Run it locally with `cargo deny check`. CI runs it on every push.

[graph]
# Only judge the dependencies we actually ship on the platforms we support.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# Fail on known security problems (RustSec database). Add an id to `ignore` only with a written reason.
version = 2
ignore = [
    { id = "RUSTSEC-2026-0293", reason = "ringbuf 0.4.8 double free if an element's Drop panics in Consumer::skip/clear. Comes in via librqbit-utp 0.7.0 (the newest), which pins ringbuf ^0.4 and the fix needs 0.5.2. Its only ring buffer is SharedRb<Heap<u8>> (stream_tx.rs): plain bytes have no Drop, so the trigger cannot happen. Revisit when librqbit-utp moves to ringbuf 0.5." },
]

[licenses]
version = 2
# Permissive licenses only. Anything not listed here (GPL, AGPL, unknown...) fails the check,
# because BitDinghy is MIT OR Apache-2.0 and must stay free of copyleft surprises.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    # Free font licenses. They only cover the fonts egui embeds (epaint_default_fonts). They
    # require shipping the license text, which the third-party notices file must include.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[bans]
# Two versions of the same crate is common and only costs size, so we warn instead of failing.
multiple-versions = "warn"
# No "*" version requirements. Our own crates refer to each other by path (publish = false),
# which is fine, so path dependencies are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only the official crates.io registry. No random git or alternative sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
