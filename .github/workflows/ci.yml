# Automatic checks that run on GitHub for every push and pull request.
# Goal: the same checks pass on Windows AND Linux from day one, so the Linux port stays easy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only need to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # NOTE: never set RUSTFLAGS here. It would silently replace the settings in .cargo/config.toml.

jobs:
  checks:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to an exact commit, so a hijacked tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes, so don't leave the token on disk

      - name: Install Linux packages needed to build the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # The oldest Rust that BitDinghy says it builds with (`rust-version` in Cargo.toml).
  msrv:
    name: Oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes, so don't leave the token on disk

      - name: Install Linux packages needed to build the window
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev

      - name: Install the Rust version in Cargo.toml
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d '"' -f2)
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build everything (tests included)
        run: cargo check --workspace --all-targets --locked

  # Checks every dependency's license against deny.toml and looks for known vulnerabilities.
  licenses-and-advisories:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes, so don't leave the token on disk
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
