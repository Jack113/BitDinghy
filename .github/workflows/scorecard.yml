# OpenSSF Scorecard: a free weekly check of this repository against open-source security best
# practices (pinned actions, branch protection, code review, dangerous workflows, ...). The
# results appear in the Security tab and as the score badge in the README.
# https://github.com/ossf/scorecard
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # to put the results in the Security tab
      id-token: write # to publish the results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
