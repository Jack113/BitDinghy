[package]
name = "bitdinghy-app"
description = "The BitDinghy window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The crate is called bitdinghy-app, but the program people double-click is BitDinghy.exe.
[[bin]]
name = "BitDinghy"
path = "src/main.rs"

[dependencies]
dinghy-core.workspace = true
eframe.workspace = true
tokio.workspace = true
png.workspace = true
rfd.workspace = true
egui_plot.workspace = true

# Windows only: reads whether Windows' "Show animations" is on (the logo stays still if not).
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
